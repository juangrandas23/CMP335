<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>

    <link rel="stylesheet" href="hello.css">

    <script>
        function myFunction() {
            var newname = document.getElementById("fname").value;
            document.getElementById("greeting").innerHTML = "Hello  " + newname + " !";
        }
    </script>
</head>

<body>
    <main class="welcome-card">
        <p class="eyebrow">A little hello</p>
        <h1>Hello!</h1>
        <p class="intro">Let's make this page a little more personal.</p>

        <form>
            <label for="fname">What's your name?</label>
            <input type="text" id="fname" name="fname" autocomplete="name" placeholder="Type your name">
        </form>
        <button type="button" onclick="myFunction()">Say hello</button>

        <p id="greeting" aria-live="polite"></p>
    </main>
</body>
</html>
