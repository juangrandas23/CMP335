<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Fox API</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="Fox.css">

    <!-- My JavaScript -->
    <script src="Fox.js"></script>
</head>


<body>

    <main>

        <!-- Top section -->
        <section class="py-5 text-center">

            <div class="container">

                <!-- Page title -->
                <h1>Random Fox API</h1>

                <!-- Page description -->
                <p class="lead text-body-secondary">
                    Click the button to get a random fox!
                </p>

                <!-- Button to call the API -->
                <button class="btn btn-primary"
                        onclick="getRandomFox()">
                    Get Random Fox
                </button>

            </div>

        </section>


        <!-- Fox section -->
        <section class="py-5 bg-body-tertiary">

            <div class="container">

                <!-- Bootstrap row -->
                <div class="row justify-content-center">

                    <!-- Responsive column -->
                    <div class="col-md-6">

                        <!-- Fox card -->
                        <div class="card shadow-sm">

                            <!-- Fox image -->
                            <img id="foxImage"
                                 class="card-img-top"
                                 alt="Random fox">

                            <!-- Card information -->
                            <div class="card-body">

                                <h2 class="card-title">
                                    Random Fox
                                </h2>

                                <p class="card-text">
                                    This fox was returned by the Random Fox API.
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="text-center py-4">

        <p>
            Random Fox API Project
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
