<!-- Declare document type and language -->
<!DOCTYPE html>
<html lang="en">

<!-- Head section -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Module 2 Assignment 1 - Palindrome Checker</title>

    <!-- Connect Bootstrap 5.0.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Connect custom CSS -->
    <link rel="stylesheet" href="Palindrome.css">

    <!-- Connect JavaScript -->
    <script src="Palindrome.js"></script>
</head>

<body>

    <!-- Bootstrap main container -->
    <div class="container-fluid my-4">

        <!-- Page title -->
        <h1 class="text-center mb-4">Palindrome Checker</h1>

        <!-- Flexbox row -->
        <div class="myflexboxRow">

            <!-- Form column -->
            <div class="myflexboxColumn card shadow-sm p-4">

                <h2 class="h4">Form to check a word</h2>

                <form id="palindromeForm"
                    onsubmit="return validateANDcheck()">

                    <!-- Word input -->
                    <label for="newWord" class="form-label">
                        Word to check:
                    </label>

                    <input type="text" id="newWord" name="newWord"
                        class="form-control">

                    <br>

                    <!-- Algorithm number input -->
                    <label for="newNumber" class="form-label">
                        Algorithm to use (1, 2, or 3):
                    </label>

                    <input type="number" id="newNumber" name="newNumber"
                        min="1" max="3" step="1" class="form-control">

                    <br>

                    <!-- Case sensitivity selection -->
                    <label for="caseOption" class="form-label">
                        Case sensitivity:
                    </label>

                    <select id="caseOption" name="caseOption"
                        class="form-select">

                        <option value="sensitive">Case Sensitive</option>
                        <option value="insensitive">Case Insensitive</option>

                    </select>

                    <br>

                    <!-- Submit button -->
                    <input type="submit" value="Check and add to list"
                        class="btn btn-primary w-100">

                </form>

            </div>

            <!-- Algorithm 1 column -->
            <div class="myflexboxColumn card shadow-sm p-4">

                <h2 class="h4">Algorithm 1</h2>

                <p><strong>(word: palindrome?)</strong></p>

                <ul id="algorithm1Results"></ul>

                <input type="button" value="Clear the list"
                    class="btn btn-outline-danger"
                    onclick="clearAlgorithm1()">

            </div>

            <!-- Algorithm 2 column -->
            <div class="myflexboxColumn card shadow-sm p-4">

                <h2 class="h4">Algorithm 2</h2>

                <p><strong>(word: palindrome?)</strong></p>

                <ul id="algorithm2Results"></ul>

                <input type="button" value="Clear the list"
                    class="btn btn-outline-danger"
                    onclick="clearAlgorithm2()">

            </div>

            <!-- Algorithm 3 column -->
            <div class="myflexboxColumn card shadow-sm p-4">

                <h2 class="h4">Algorithm 3</h2>

                <p><strong>(word: palindrome?)</strong></p>

                <ul id="algorithm3Results"></ul>

                <input type="button" value="Clear the list"
                    class="btn btn-outline-danger"
                    onclick="clearAlgorithm3()">

            </div>

        </div>

    </div>

</body>

</html>
